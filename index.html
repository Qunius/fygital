<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141310">
  <title>Fygital — Countdown</title>
  <meta name="description" content="Fygital. Opening in 2032.">
  <link rel="preload" href="assets/Michroma-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="animation.js?v=4" defer></script>
</head>
<body class="is-entering">
  <div class="room" aria-hidden="true">
    <div class="room-camera">
      <div class="room-panels"></div>
    </div>
    <div class="room-shade"></div>
  </div>
  <div class="intro" aria-hidden="true"><img class="intro-mark" src="assets/wordmark.svg" alt=""></div>
  <div class="page">
    <header>
      <img class="wordmark" src="assets/wordmark.svg" alt="Fygital" width="324" height="38">
    </header>
    <main>
      <h1 class="countdown-title">Opening in</h1>
      <div class="countdown" role="timer" aria-live="off" aria-label="Countdown to opening">
        <div class="unit" data-unit="years"><div class="number" aria-hidden="true">06</div><span class="unit-label">years</span></div>
        <div class="unit" data-unit="days"><div class="number" aria-hidden="true">000</div><span class="unit-label">days</span></div>
        <div class="unit" data-unit="hours"><div class="number" aria-hidden="true">00</div><span class="unit-label">hours</span></div>
        <div class="unit" data-unit="minutes"><div class="number" aria-hidden="true">00</div><span class="unit-label">minutes</span></div>
        <div class="unit" data-unit="seconds"><div class="number" aria-hidden="true">00</div><span class="unit-label">seconds</span></div>
      </div>
    </main>
  </div>
  <noscript><style>.intro{display:none}.room-panels{background:url(assets/room.png) center/cover}.wordmark,.countdown-title,.unit,.unit-label{opacity:1!important;transform:none!important}</style></noscript>
</body>
</html>
